spring.application.name=dischargebridge

# Server port
server.port=8080

# Default In-Memory Profile for seamless standalone operation & testing
spring.datasource.url=jdbc:h2:mem:dischargebridge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Console for rapid inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=9a3f2c4e6b8a1d0f5e7c3b9a2d4f6e8b1a3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e
jwt.expiration-ms=86400000

# OpenAPI Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
